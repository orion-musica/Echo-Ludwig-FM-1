    <details class="opts">
      <summary>Display options</summary>
      <fieldset>
        <legend>Text size</legend>
        <div class="choices">
          <label><input type="radio" name="size" value="1"> Normal</label>
          <label><input type="radio" name="size" value="2"> Large</label>
          <label><input type="radio" name="size" value="3"> Very large</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Colours</legend>
        <div class="choices">
          <label><input type="radio" name="theme" value="auto"> Like my device</label>
          <label><input type="radio" name="theme" value="dark"> White on black</label>
          <label><input type="radio" name="theme" value="light"> Black on white</label>
          <label><input type="radio" name="theme" value="yellow"> Yellow on black</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Spacing</legend>
        <div class="choices"><label><input type="checkbox" id="wide"> Wider spacing between lines, words and letters</label></div>
      </fieldset>
    </details>
